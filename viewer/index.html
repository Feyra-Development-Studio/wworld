<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Dungeon Viewer</title>
  <style>
    body { font-family: sans-serif; }
    canvas { border: 1px solid #333; image-rendering: pixelated; }
  </style>
</head>
<body>
  <h3>Dungeon JSON Viewer</h3>
  <input type="file" id="fileInput" accept="application/json" />
  <div id="info"></div>
  <canvas id="c" width="640" height="480"></canvas>
  <script>
    const fileInput = document.getElementById('fileInput');
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    fileInput.addEventListener('change', (ev) => {
      const file = ev.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const geo = JSON.parse(e.target.result);
          renderGeo(geo);
        } catch (err) {
          document.getElementById('info').innerText = 'Invalid JSON file';
        }
      };
      reader.readAsText(file);
    });

    function renderGeo(geo) {
      ctx.fillStyle = '#111';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      document.getElementById('info').innerText = 'Level: ' + (geo.meta && geo.meta.level);
      // Simple placeholder: draw rooms as rectangles from geometry if present
      if (!geo.rooms) return;
      ctx.save();
      ctx.translate(10,10);
      geo.rooms.forEach((r, i) => {
        ctx.strokeStyle = '#0f0';
        if (r.parts && r.parts.length>0) {
          r.parts.forEach(p => {
            if (p.partType == 'rect') {
              ctx.strokeRect(p.x*4, p.y*4, p.w*4, p.h*4);
            } else if (p.partType == 'ellipse') {
              ctx.beginPath();
              ctx.ellipse(p.center[0]*4, p.center[1]*4, p.rx*4, p.ry*4, 0, 0, Math.PI*2);
              ctx.stroke();
            }
          });
        }
      });
      ctx.restore();
    }
  </script>
</body>
</html>
