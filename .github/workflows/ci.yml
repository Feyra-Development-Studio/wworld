name: build, test, release

on:
  # Только по требованию.
  #
  # Прогон по каждому push давал ровно то, чего быть не должно: правки идут
  # подряд, каждый новый прогон отменяет предыдущий, и в списке коммитов
  # остаётся вереница красных отметок «cancelled» — при том, что ничего не
  # ломалось. Проверка, которая краснеет от самого факта работы, не сообщает
  # ничего и приучает не смотреть на неё вовсе.
  #
  # Поэтому запуск делается осознанно, когда правки дописаны.
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Тесты ядра, пакеты Linux и Windows'
        type: boolean
        default: true
      run_android:
        description: 'Собрать APK и прогнать на эмуляторе'
        type: boolean
        default: false

# Новый прогон отменяет предыдущий на той же ветке: если коммиты идут подряд,
# смысл имеет только последний.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  SEED: "20260813"

jobs:

  core:
    name: тесты ядра
    if: inputs.run_tests
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v4

    - name: Подмодули
      run: tools/deps.sh core

    - name: Окружение
      run: |
        set -euo pipefail
        mkdir -p logs
        { uname -a; cat /etc/os-release; } 2>&1 | tee logs/00-env.log

    - name: Установка Free Pascal и R
      run: |
        set -euo pipefail
        {
          sudo apt-get update
          # fp-units-fcl нужен ради contnrs, одного fp-compiler не хватает
          sudo apt-get install -y fp-compiler fp-units-base fp-units-fcl
          # r-base-core без recommends: рекомендованные тянут пол-CRAN.
          # codetools ставим явно — без него reference-классы не проверяются
          # и молча пропускают методы, переданные по имени
          sudo apt-get install -y --no-install-recommends r-base-core r-cran-codetools
          fpc -iV
          Rscript --version
        } 2>&1 | tee logs/01-deps.log

    - name: Сборка генератора
      run: |
        set -euo pipefail
        fpc -Mobjfpc -Sh -O2 -Fusrc/dungeon -FUsrc/dungeon \
            -osrc/demo/demo src/demo/demo.pas 2>&1 | tee logs/02-build-generator.log

    - name: Сборка ходилки
      run: |
        set -euo pipefail
        fpc -Mobjfpc -Sh -O2 -Fusrc/dungeon -FUsrc/dungeon \
            -osrc/demo/wwwalk src/demo/wwwalk.pas 2>&1 | tee logs/03-build-walker.log

    - name: Поиск пути для ходьбы указанием
      # Окно здесь не нужно: указание клетки приходит от мыши или касания, а
      # сам поиск пути от способа указания не зависит. Поэтому проверка идёт
      # на обычном бегунке, без BearLibTerminal и без эмулятора.
      run: |
        set -euo pipefail
        mkdir -p build/tests
        fpc -Mobjfpc -Sh -Fusrc/dungeon -FUbuild/tests \
            -obuild/tests/testpath tests/path/testpath.pas 2>&1 | tee logs/03-path-build.log
        ./build/tests/testpath 2>&1 | tee logs/03-path.log

    - name: Компиляция ветки BearLibTerminal
      # линковка требует libBearLibTerminal.so, поэтому только компиляция (-Cn)
      run: |
        set -euo pipefail
        mkdir -p .bltunits
        fpc -Mobjfpc -Sh -Cn -dUSE_BLT -Fusrc/dungeon \
            -Futhird_party/bearlibterminal/Terminal/Include/Pascal \
            -FU.bltunits src/dungeon/wwViewer.pas 2>&1 | tee logs/04-blt.log

    - name: Дымовой тест геометрии и топологии на R
      run: |
        set -euo pipefail
        printf 'PING\nSHAPE circle 7\nBRUSH 3\nEXPAND 2 2 5 5 6 6\nWALLS 5 3 000000200000000\nFINALIZE 5 3 2 1 000000200000000\nQUIT\n' \
          | Rscript scripts/geometry.R 2>&1 | tee logs/05-geometry.log

    - name: Генерация 10 этажей
      # Основное хранилище — out/dungeon.json с графом-инструкцией. Флаг
      # --test добавляет выгрузку out/csv и сверяет обратную сборку.
      run: |
        set -euo pipefail
        ./src/demo/demo --seed "$SEED" --levels 10 --out out --test 2>&1 | tee logs/06-generate.log

    - name: Проверка инвариантов на R
      run: |
        set -euo pipefail
        Rscript scripts/validate_dungeon.R --dir out/csv 2>&1 | tee logs/07-validate.log

    - name: Проверка детерминизма
      run: |
        set -euo pipefail
        {
          ./src/demo/demo --seed "$SEED" --levels 10 --out out_repeat --test
          diff -r out out_repeat && echo "детерминизм подтверждён"
        } 2>&1 | tee logs/08-determinism.log
        rm -rf out_repeat

    - name: Дымовой тест ходилки
      # оба источника: граф из JSON (карта строится заново) и выгрузка CSV
      run: |
        set -euo pipefail
        {
          ./src/demo/wwwalk --json out/dungeon.json --script "ddsswwaa" | tail -2
          ./src/demo/wwwalk --dir out/csv --script "ddsswwaa" | tail -2
        } 2>&1 | tee logs/09-walk.log

    - name: Подземелье (при успехе)
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: dungeon
        path: out/
        if-no-files-found: error

    - name: Логи (при провале)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: failure-logs-core
        path: logs/
        if-no-files-found: warn
        retention-days: 14

  # Задача #2: Renjin как второй движок геометрии. Renjin запускается точно
  # так же, как Rscript — дочерним процессом, читающим stdin; ничего
  # слушающего порт в клиентском приложении быть не должно.
  # Сверяются и ответы на наборе команд, и подземелья целиком при одном seed.
  renjin:
    name: Renjin как движок геометрии
    if: inputs.run_tests
    needs: core
    continue-on-error: true
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Инструменты
      run: |
        set -euo pipefail
        mkdir -p logs
        sudo apt-get update
        sudo apt-get install -y fp-compiler fp-units-base fp-units-fcl
        sudo apt-get install -y --no-install-recommends r-base-core r-cran-codetools

    - name: Сборка генератора
      run: |
        set -euo pipefail
        fpc -Mobjfpc -Sh -O2 -Fusrc/dungeon -FUsrc/dungeon \
            -osrc/demo/demo src/demo/demo.pas > /dev/null

    - name: Сверка движков
      run: |
        set -euo pipefail
        tests/engine-check/check.sh build/renjin ./src/demo/demo "$SEED" 2>&1 | tee logs/30-renjin.log

    - name: Отчёт
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: renjin-check
        path: |
          logs/
          build/renjin/*.txt
          build/renjin/*.diff
          build/renjin/*.log
          build/renjin/*.err
        if-no-files-found: warn
        retention-days: 30

  linux-packages:
    name: пакеты Linux (deb, rpm)
    if: inputs.run_tests
    needs: core
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v4

    - name: Инструменты сборки
      run: |
        set -euo pipefail
        mkdir -p logs
        sudo apt-get update
        sudo apt-get install -y fp-compiler fp-units-base fp-units-fcl rpm
        sudo apt-get install -y --no-install-recommends r-base-core r-cran-codetools

    - name: Версия
      id: ver
      run: echo "value=$(cat VERSION).${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

    - name: Сборка пакетов
      run: |
        set -euo pipefail
        packaging/build-linux.sh "${{ steps.ver.outputs.value }}" dist 2>&1 | tee logs/10-build-packages.log

    # Проверяется не факт сборки, а установленная программа: пакет ставится в
    # систему, и всё запускается из чужого каталога, где нет ни исходников,
    # ни scripts/. Так ловится забытый в пакете ресурс.
    - name: Установка и запуск deb
      run: |
        set -euo pipefail
        {
          sudo apt-get install -y ./dist/wworld_*_amd64.deb
          dpkg -L wworld
          cd /tmp
          wworld --seed 4242 --levels 4 --out inst --test
          Rscript /usr/share/wworld/validate_dungeon.R --dir inst/csv
          wworld-walk --json inst/dungeon.json --script "ddss" | tail -1
          wworld-walk --dir inst/csv --script "ddss" | tail -1
        } 2>&1 | tee logs/11-deb-install.log

    - name: Удаление deb
      run: |
        set -euo pipefail
        sudo apt-get remove -y wworld 2>&1 | tee logs/12-deb-remove.log
        test ! -e /usr/bin/wworld && echo "пакет снят начисто"

    # rpm проверяется в родной системе: Fedora в контейнере на том же раннере
    - name: Установка и запуск rpm в Fedora
      run: |
        set -euo pipefail
        {
          docker run --rm -v "$PWD/dist:/dist" fedora:40 bash -euo pipefail -c '
            dnf install -y -q R-core >/dev/null
            rpm -i /dist/wworld-*.x86_64.rpm
            rpm -ql wworld
            cd /tmp
            wworld --seed 4242 --levels 4 --out inst --test
            Rscript /usr/share/wworld/validate_dungeon.R --dir inst/csv
            wworld-walk --dir inst/csv --script "ddss" | tail -1
            rpm -e wworld
            test ! -e /usr/bin/wworld && echo "пакет снят начисто"
          '
        } 2>&1 | tee logs/13-rpm-install.log

    - name: Пакеты
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: linux-packages
        path: dist/
        if-no-files-found: error

    - name: Логи (при провале)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: failure-logs-linux
        path: logs/
        if-no-files-found: warn
        retention-days: 14

  windows-build:
    name: сборка Windows (кросс)
    if: inputs.run_tests
    needs: core
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v4

    - name: Инструменты кросс-сборки
      run: |
        set -euo pipefail
        mkdir -p logs
        sudo apt-get update
        # цель Win64 умеет тот же ppcx64, нужны только win-модули и линкер
        sudo apt-get install -y fp-compiler fp-units-base fp-units-fcl zip \
                                fp-units-win-base fp-units-win-fcl \
                                binutils-mingw-w64-x86-64

    - name: Версия
      id: ver
      run: echo "value=$(cat VERSION).${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

    - name: Сборка zip
      run: |
        set -euo pipefail
        packaging/build-windows.sh "${{ steps.ver.outputs.value }}" dist 2>&1 | tee logs/20-build-windows.log
        file build/windows/wworld/wworld.exe

    - uses: actions/upload-artifact@v4
      with:
        name: windows-zip
        path: dist/
        if-no-files-found: error

    - name: Логи (при провале)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: failure-logs-windows-build
        path: logs/
        if-no-files-found: warn

  windows-test:
    name: прогон на Windows
    needs: windows-build
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/download-artifact@v4
      with:
        name: windows-zip
        path: dist

    - uses: r-lib/actions/setup-r@v2
      with:
        r-version: release

    - name: Распаковка и запуск
      run: |
        set -euo pipefail
        unzip -q dist/wworld_*_win64.zip -d run
        cd run/wworld
        Rscript --version
        ./wworld.exe --seed 4242 --levels 4 --out out --test
        Rscript validate_dungeon.R --dir out/csv
        ./wworld-walk.exe --json out/dungeon.json --script "ddss" | tail -1
        ./wworld-walk.exe --dir out/csv --script "ddss" | tail -1

  # Сборка приложения под Android и прогон на эмуляторе.
  #
  # Выключено по умолчанию: эмулятор поднимается минуты, и гонять его на
  # каждой правке, пока приложение только складывается, — жечь время впустую.
  # Включается доводом при ручном запуске.
  android:
    name: APK и прогон на эмуляторе
    if: inputs.run_android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Подмодули
        run: tools/deps.sh android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Сборка APK
        run: |
          set -euo pipefail
          cd android
          gradle wrapper --gradle-version 8.7
          ./gradlew assembleDebug --no-daemon

      - name: Что собралось
        run: |
          set -euo pipefail
          APK="$(find android -name '*.apk' | head -1)"
          [ -n "$APK" ] || { echo "APK не собрался"; exit 1; }
          ls -sh "$APK"
          unzip -l "$APK" | grep -E "\.so$" || { echo "в APK нет ни одной библиотеки"; exit 1; }

      # KVM бегунку доступен, но по умолчанию закрыт правами.
      - name: Открыть KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Прогон на эмуляторе
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: default
          # Профиль по умолчанию даёт 320x560 — на таком экране сетка выходит
          # игрушечной, и проверять на нём нечего. Берём обычный телефон.
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r $(find android -name '*.apk' | head -1)
            adb logcat -c
            adb shell am start -n ru.wworld/.TerminalActivity
            sleep 20
            adb logcat -d > logcat.txt
            adb exec-out screencap -p > screen.png
            echo "== что сказал терминал =="
            grep -iE "wworld|BearLibTerminal|EGL_emulation.*rcv" logcat.txt | head -40
            # Каждая строка уходит в sh -c отдельно, поэтому многострочный if
            # тут не работает: первый прогон упал именно на этом, а не на
            # приложении. Всё, что проверяется, пишется в одну строку.
            grep -q "FATAL EXCEPTION\|beginning of crash" logcat.txt && { echo "приложение упало"; exit 1; } || true
            grep -q "терминал открыт на устройстве" logcat.txt || { echo "терминал не открылся"; exit 1; }
            grep -qE "eglCreateContext.*maj 3" logcat.txt || { echo "контекст GLES3 не создан"; exit 1; }
            grep -oE "экран [0-9]+x[0-9]+, ячейка [0-9]+x[0-9]+, сетка [0-9]+x[0-9]+" logcat.txt | tail -1
            grep -qE "экран [1-9][0-9]*x[1-9][0-9]*" logcat.txt || { echo "размер экрана не определился"; exit 1; }
            echo "== ввод: короткое касание =="
            adb logcat -c
            adb shell input tap 400 320
            sleep 3
            adb logcat -d > tap.txt
            grep -E "нажатие|отпускание|движение" tap.txt | head -5
            grep -q "нажатие: клетка" tap.txt || { echo "касание не дало нажатия"; exit 1; }
            echo "== ввод: протаскивание =="
            adb logcat -c
            adb shell input swipe 200 600 800 900 700
            sleep 3
            adb logcat -d > swipe.txt
            grep -cE "движение" swipe.txt
            grep -q "движение" swipe.txt || { echo "протаскивание не дало движений"; exit 1; }
            grep -q "нажатие: клетка" swipe.txt && { echo "протаскивание превратилось в щелчок"; exit 1; } || true
            adb exec-out screencap -p > screen-input.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-run
          path: |
            logcat.txt
            tap.txt
            swipe.txt
            screen.png
            screen-input.png
            android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
