name: dungeon generator (Pascal + R)

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    # Каждый шаг пишет свой лог в logs/. При успехе артефактом уходят карты,
    # при провале — логи вместо них. В репозитории результат генерации не
    # хранится: он выводится из seed и всегда воспроизводим.
    - name: Окружение
      run: |
        set -euo pipefail
        mkdir -p logs
        { uname -a; cat /etc/os-release; } 2>&1 | tee logs/00-env.log

    - name: Установка Free Pascal и R
      run: |
        set -euo pipefail
        {
          sudo apt-get update
          # fp-units-fcl нужен ради contnrs, одного fp-compiler не хватает
          sudo apt-get install -y fp-compiler fp-units-base fp-units-fcl
          # r-base-core без recommends: рекомендованные тянут пол-CRAN
          sudo apt-get install -y --no-install-recommends r-base-core
          fpc -iV
          Rscript --version
        } 2>&1 | tee logs/01-deps.log

    - name: Сборка генератора
      run: |
        set -euo pipefail
        fpc -Mobjfpc -Sh -O2 -Fusrc/dungeon -FUsrc/dungeon \
            -osrc/demo/demo src/demo/demo.pas 2>&1 | tee logs/02-build-generator.log

    - name: Сборка ходилки
      run: |
        set -euo pipefail
        fpc -Mobjfpc -Sh -O2 -Fusrc/dungeon -FUsrc/dungeon \
            -osrc/demo/wwwalk src/demo/wwwalk.pas 2>&1 | tee logs/03-build-walker.log

    - name: Компиляция ветки BearLibTerminal
      # линковка требует libBearLibTerminal.so, поэтому только компиляция (-Cn)
      run: |
        set -euo pipefail
        mkdir -p .bltunits
        fpc -Mobjfpc -Sh -Cn -dUSE_BLT -Fusrc/dungeon \
            -Futhird_party/bearlibterminal/Terminal/Include/Pascal \
            -FU.bltunits src/dungeon/wwViewer.pas 2>&1 | tee logs/04-blt.log

    - name: Дымовой тест геометрии на R
      run: |
        set -euo pipefail
        printf 'PING\nSHAPE circle 7\nBRUSH 3\nEXPAND 2 2 5 5 6 6\nQUIT\n' \
          | Rscript scripts/geometry.R 2>&1 | tee logs/05-geometry.log

    - name: Генерация 10 этажей
      # генерации нужен Rscript: формы комнат и клетки коридоров считает
      # scripts/geometry.R, поднимаемый как постоянный процесс
      run: |
        set -euo pipefail
        ./src/demo/demo --seed 20260813 --levels 10 --out csv 2>&1 | tee logs/06-generate.log

    - name: Проверка инвариантов на R
      run: |
        set -euo pipefail
        Rscript scripts/validate_dungeon.R --dir csv 2>&1 | tee logs/07-validate.log

    - name: Проверка детерминизма
      run: |
        set -euo pipefail
        {
          ./src/demo/demo --seed 20260813 --levels 10 --out csv_repeat
          diff -r csv csv_repeat && echo "детерминизм подтверждён"
        } 2>&1 | tee logs/08-determinism.log
        rm -rf csv_repeat

    - name: Дымовой тест ходилки
      run: |
        set -euo pipefail
        ./src/demo/wwwalk --dir csv --script "ddsswwaa" 2>&1 | tee logs/09-walk.log

    - name: Карты (при успехе)
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: dungeon-csv
        path: csv/
        if-no-files-found: error

    - name: Логи (при провале)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: failure-logs
        path: logs/
        if-no-files-found: warn
        retention-days: 14
