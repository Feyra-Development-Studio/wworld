plugins { id 'com.android.application' }

android {
    namespace 'ru.wworld'
    compileSdk 34

    defaultConfig {
        applicationId "ru.wworld"
        // minSdk 28 задан не отсюда: планку подняли dex-требования Renjin,
        // которому нужен API 28, чтобы переводиться без предупреждений.
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "0.1"

        // arm64-v8a — то, на чём играют; x86_64 — то, на чём проверяют:
        // эмулятор в CI работает на x86_64, и APK только под arm туда просто
        // не ставится (INSTALL_FAILED_NO_MATCHING_ABIS). Собирать под обе
        // дешевле, чем гонять эмулятор под arm без ускорения — он на порядок
        // медленнее и на бегунке не укладывается в разумное время.
        ndk { abiFilters 'arm64-v8a', 'x86_64' }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    sourceSets {
        // Библиотека игры и выгрузка карты кладутся сюда сборочными
        // скриптами до вызова Gradle: одна собирается Free Pascal, вторая —
        // генератором. Gradle их только упаковывает.
        main {
            jniLibs.srcDirs += ['../../build/android']
            assets.srcDirs += ['../../build/android-assets']
            // Сборщик карты и движок геометрии общие с настольной сборкой:
            // копировать их сюда значило бы завести вторую правду.
            java.srcDirs += ['../../java/src']
        }
    }

    // Renjin — интерпретатор R на JVM, около семнадцати мегабайт классов.
    // Дексованием и слиянием занимается сам Android Gradle Plugin; multidex
    // при minSdk 28 поддержан системой, отдельной библиотеки не нужно.
    packagingOptions {
        resources {
            // В Renjin и его зависимостях повторяются служебные файлы —
            // без этого упаковка спорит сама с собой.
            excludes += ['META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA',
                         'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/DEPENDENCIES']
            pickFirsts += ['**/*.properties', '**/*.xml']
        }
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Движок R и разбор JSON кладутся в app/libs сборочным шагом: renjin
    // собирается из подмодуля (tools/renjin-jar.sh), json берётся с maven.
    // На Android org.json есть в самой системе, но общие с настольной
    // сборкой классы компилируются против отдельной библиотеки.
    implementation fileTree(dir: 'libs', include: ['renjin*.jar'])

    // org.json в APK не кладётся: он есть в самой системе, и вторая копия
    // тех же классов — верный способ получить спор при дексовании. Для
    // компиляции хватает того, что даёт android.jar.
}
